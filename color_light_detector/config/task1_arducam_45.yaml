# New beacon: whole-object YOLO, physical plate/aperture, native RGB photometry.
# No camera settings are written. Empty model_path resolves to packaged weights.
task1_beacon:
  ros__parameters:
    model_path: ''
    model_task: segment
    algorithm_version: NEW_BEACON_RING_APERTURE
    image_topic: /arducam/image_raw
    result_topic: /task1/beacons/results_json
    debug_topic: /task1/beacons/debug_image
    debug_max_fps: 2.0
    debug_always_publish: false
    debug_show_missing_tracks: true
    debug_image_size: [960, 600]
    device: auto
    inference_precision: 16
    image_size: 1280
    confidence: 0.35
    max_detections: 12
    max_fps: 10.0
    processing.cpu_threads: 2
    roi_padding_ratio: 0.12
    minimum_confirmed_hits: 3
    tracking.association_mode: two_stage_global
    tracking.iou_threshold: 0.2
    tracking.center_distance_ratio: 1.25
    tracking.bbox_smoothing_alpha: 1.0
    tracking.max_age_seconds: 3.0
    tracking.high_confidence_threshold: 0.8
    tracking.low_confidence_threshold: 0.2
    tracking.low_stage_iou_threshold: 0.1
    tracking.low_stage_center_distance_ratio: 0.75
    tracking.motion_horizon_seconds: 0.35
    tracking.temporal_reset_distance_ratio: 0.65
    tracking.color_roi_bbox_source: detector
    tracking.stationary_reid_enabled: false
    tracking.duplicate_suppression_enabled: true
    tracking.duplicate_iou_threshold: 0.45
    tracking.duplicate_containment_threshold: 0.85
    tracking.duplicate_center_distance_ratio: 0.3
    tracking.weak_birth_enabled: false
    color.lit_confirm_frames: 2
    color.dark_confirm_frames: 2
    color.color_switch_frames: 3
    color.off_without_lit_min_hits: 15
    color.off_without_lit_min_detector_confidence: 0.45
    color.emitter_hint_update_confidence_min: 0.55
    color.emitter_hint_update_alpha: 0.2
    temporal_color_evidence_mode: all_colors
    temporal.history_seconds: 4.5
    temporal.blink_min_window: 2.8
    temporal.blink_min_transitions: 3
    temporal.blink_min_hz: 0.35
    temporal.blink_max_hz: 0.65
    temporal.solid_min_seconds: 1.5
    temporal.off_min_seconds: 2.2
    temporal.color_purity_min: 0.7
    temporal.mode: emitter_signal
    temporal.template_target_hz: 0.5
    temporal.template_frequency_tolerance: 0.05
    temporal.template_min_agreement: 0.76
    temporal.template_phase_steps: 40
    temporal.photometric_min_samples: 12
    temporal.photometric_min_agreement: 0.78
    temporal.photometric_low_threshold: 0.32
    temporal.photometric_high_threshold: 0.68
    temporal.photometric_signal_delta_min: 0.012
    temporal.photometric_color_delta_min: 0.008
    temporal.photometric_color_purity_min: 0.55
    temporal.photometric_blue_purity_min: 0.60
    temporal.photometric_color_level_min: 0.004
    temporal.photometric_blue_level_min: 0.008
    temporal.photometric_color_phase_mode: shared_luminance
    temporal.photometric_max_gap_seconds: 0.35
    state_change.enabled: true
    state_change.candidate_min_frames: 2
    state_change.candidate_min_seconds: 0.12
    state_change.candidate_hold_seconds: 1.2
    state_change.commit_min_frames: 2
    state_change.commit_confidence_min: 0.55
    state_change.change_pending_seconds: 0.3
    state_change.change_clear_seconds: 0.4
    state_change.blink_phase_timeout_seconds: 1.3
    online_light.enabled: true
    online_light.require_periodic: true
    online_light.window_seconds: 6.0
    online_light.min_samples: 12
    online_light.min_cluster_seconds: 0.3
    online_light.min_separation: 0.012
    online_light.noise_multiplier: 3.0
    online_light.off_ratio: 0.45
    online_light.on_ratio: 0.60
    online_light.adapt_seconds: 3.0
    online_light.max_gap_seconds: 0.35
    online_light.reference_hold_seconds: 3.0
    online_light.min_motion_quality: 0.55
    online_light.min_measurement_quality: 0.55
    online_light.require_emitted_on_for_learning: true
    online_light.bootstrap_off_fraction: 0.62
    online_light.bootstrap_on_frames: 3
    online_light.bootstrap_on_signal_min: 0.05
    online_light.bootstrap_on_contrast_min: 12.0
    online_light.color_change_frames: 3
    online_light.lock_emitter_center: false
    online_light.fit_interval_seconds: 0.5
    steady_off.enabled: false
    scheduling.enabled: true
    scheduling.search_fps: 4.0
    scheduling.track_fps: 1.5
    scheduling.motion_fps: 4.0
    scheduling.budget_enabled: true
    scheduling.duty_cycle: 0.5
    scheduling.min_idle_seconds: 0.08
    scheduling.max_result_age_seconds: 0.85
    scheduling.max_track_age_seconds: 1.5
    scheduling.motion_max_gap_seconds: 0.35
    scheduling.motion_max_width: 960
    scheduling.motion_max_fb_error: 1.5
    scheduling.stationary_context_fallback: true
    scheduling.adaptive_enabled: true
    scheduling.independent_roi_tracking: true
    scheduling.motion_speed_threshold: 0.25
    scheduling.stable_hold_seconds: 1.0
    scheduling.stable_motion_quality: 0.65
    roi_continuity.enabled: true
    roi_continuity.anchor_seconds: 2.4
    roi_continuity.confirm_on_frames: 3
    roi_continuity.search_ratio: 0.22
    roi_continuity.min_correlation: 0.74
    roi_continuity.reference_seconds: 0.6
    roi_continuity.max_anchor_shift_ratio: 0.65
    local_zoom.enabled: true
    local_zoom.image_size: 640
    local_zoom.full_frame_seconds: 2.0
    local_zoom.context_ratio: 3.0
    local_zoom.min_side_pixels: 192
    local_zoom.max_area_fraction: 0.45
    local_zoom.max_target_side_pixels: 320
    local_zoom.preview_enabled: true
    risk.enabled: true
    risk.candidate_burst_seconds: 1.0
    risk.candidate_cooldown_seconds: 4.0
    risk.detector_age_seconds: 2.5
    risk.small_target_pixels: 32.0
    risk.edge_margin_ratio: 0.04
    # Native pixel sizes: raising these rejects more unresolved small apertures.
    lamp_region.max_roi_side: 640
    lamp_region.roi_margin_fraction: 0.06
    lamp_region.min_outer_diameter: 20.0
    lamp_region.min_outer_fraction: 0.20
    lamp_region.min_aperture_diameter: 6.0
    lamp_region.min_aperture_fraction: 0.03
    lamp_region.min_axis_ratio: 0.30
    lamp_region.max_fit_error: 0.17
    lamp_region.min_arc_coverage: 0.70
    lamp_region.min_inner_ratio: 0.10
    lamp_region.max_inner_ratio: 0.55
    lamp_region.max_tracking_gap: 0.35
    lamp_region.tracking_min_support: 0.60
    lamp_region.max_center_shift: 0.30
    lamp_region.max_scale_change: 0.35
    # Brightness always uses the fixed physical aperture; hue masks never move it.
    lamp_photometry.aperture_shrink: 0.94
    lamp_photometry.halo_scale: 1.70
    lamp_photometry.min_aperture_pixels: 16
    lamp_photometry.min_aperture_coverage: 0.80
    lamp_photometry.saturation_min: 50
    lamp_photometry.color_value_min: 40
    lamp_photometry.source_value_min: 140
    lamp_photometry.source_support_min: 0.04
    lamp_photometry.channel_contrast_min: 24
    lamp_photometry.color_share_min: 0.62
    lamp_photometry.color_margin_min: 0.18
    lamp_photometry.dark_value_max: 65
    lamp_photometry.clipped_support_min: 0.60
    lamp_photometry.halo_support_min: 0.30
    lamp_photometry.halo_sector_coverage_min: 0.67
    position.enabled: true
    position.config_file: ''
    position.result_topic: /task1/beacons/positions_json
