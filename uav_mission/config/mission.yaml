uav_mission_manager:
  runtime:
    update_rate_hz: 10.0
    progress_rate_hz: 1.0

  topics:
    task_command: /tongji_mrl/tsky/task_cmd
    progress: /tongji_mrl/tsky/progress

    vehicle_local_position: /fmu/out/vehicle_local_position_v1
    offboard_control_mode: /fmu/in/offboard_control_mode
    trajectory_setpoint: /fmu/in/trajectory_setpoint

    map_result: /tongji_mrl/tsky/map_targets_ned
    task1_notify: /tongji_mrl/tsky/task1
    task1_reply: /tongji_mrl/twave/task1
    task1_position: /tongji_mrl/twave/task1_position

    task3_event: /tongji_mrl/twave/task3
    task4_event: /tongji_mrl/twave/task4

    vehicle_status: /fmu/out/vehicle_status_v1
    vehicle_attitude: /fmu/out/vehicle_attitude
    battery_status: /fmu/out/battery_status

    course_config: /tongji_mrl/tsky/course_config

    vehicle_command: /fmu/in/vehicle_command
    
    task3_platform: /tongji_mrl/twave/task3_platform
    
    vision_control: /tongji_mrl/tsky/downward_vision_control
    
    gripper_command: /task3/gripper/command
    
    checkpoint: /tongji_mrl/tsky/checkpoint

    height_sensor: /height_sensor/range

  map:
    ascend_speed_m_s: 0.3
    search_height_m: 2.0
    ascend_speed_m_s: 0.3
    route_speed_m_s: 0.3
    waypoint_tolerance_m: 0.10

  target:
    receive_timeout_s: 30.0
    x_tolerance_m: 0.20
    y_tolerance_m: 0.20
    z_tolerance_m: 0.10
    local_position_timeout_s: 5.0 #这里在真实比赛中可以看情况调整

  motion:
    fly_speed_m_s: 0.5

  follow:
    speed_m_s: 0.5
    xy_tolerance_m: 0.10
    position_timeout_s: 1.0

  safety:
    input_timeout_s: 0.5
    minimum_battery_remaining: 0.20
    battery_timeout_s: 2.0
    require_battery: true
    allow_dead_reckoning: false

  task3:
    fly_speed_m_s: 0.5
    platform_tolerance_m: 0.10
    visual_move_speed_m_s: 0.10
    gripper_xy_tolerance_m: 0.05
    vision_timeout_s: 1.0
    pick_speed_m_s: 0.10
    pick_tolerance_m: 0.05
    return_speed_m_s: 0.20
    return_tolerance_m: 0.05
    gripper_close_wait_s: 5.0
    verify_duration_s: 2.0
    verify_max_retries: 3
    home_xy_tolerance_m: 0.20
    descend_speed_m_s: 0.20

    xy_small_tolerance_m: 0.03
    xy_large_tolerance_m: 0.10
    xy_servo_kp: 0.8
    align_stable_duration_s: 0.5
    range_timeout_s: 0.5
    sensor_to_gripper_m: 0.24
    grasp_distance_m: 0.20
    descend_to_tin_speed_m_s: 0.1
    recover_max_retries: 3
    
  task4:
    fly_speed_m_s: 0.5
    xy_tolerance_m: 0.10