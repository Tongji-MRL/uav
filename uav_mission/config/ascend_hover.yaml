uav_ascend_hover:
  ros__parameters:
    # Relative height above the position recorded when this node starts.
    target_altitude_m: 2.0
    altitude_tolerance_m: 0.20
    arrival_stable_s: 1.0

    # PX4 Offboard requires a continuous control stream (> 2 Hz).
    update_rate_hz: 20.0
    local_position_timeout_s: 1.0
    prestream_duration_s: 1.0
    offboard_request_interval_s: 0.5

    topics:
      vehicle_status: /fmu/out/vehicle_status_v1
      vehicle_local_position: /fmu/out/vehicle_local_position_v1
      vehicle_attitude: /fmu/out/vehicle_attitude
      offboard_control_mode: /fmu/in/offboard_control_mode
      trajectory_setpoint: /fmu/in/trajectory_setpoint
      vehicle_command: /fmu/in/vehicle_command
